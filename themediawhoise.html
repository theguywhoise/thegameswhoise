<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0d12">
  <meta name="description" content="themediawhoise — movies and TV">
  <title>themediawhoise</title>
  <link rel="icon" type="image/png" href="logo.png">
  <style>
    :root{color-scheme:dark;--bg:#090b10;--panel:#151922;--text:#f7f8ff;--muted:#9da4b5;--accent:#a68cff}
    *{box-sizing:border-box}html,body{height:100%}body{margin:0;overflow:hidden;font-family:Inter,"Segoe UI",system-ui,sans-serif;background:radial-gradient(circle at 65% 12%,rgba(84,66,150,.18),transparent 28%),linear-gradient(135deg,#080a0f,#10131a 60%,#090a0f);color:var(--text)}
    .shell{height:100vh;display:grid;grid-template-columns:92px 1fr}.rail{border-right:1px solid rgba(255,255,255,.055);background:rgba(5,7,11,.62);display:flex;flex-direction:column;align-items:center;padding:24px 12px 20px}.mark{width:44px;height:44px;border-radius:14px;background:linear-gradient(145deg,var(--accent),#6d5be7);display:grid;place-items:center;font-size:20px;font-weight:900;margin-bottom:32px}.rail-button{width:54px;height:54px;border:0;border-radius:18px;margin:5px 0;background:transparent;color:#777e91;text-decoration:none;display:grid;place-items:center;cursor:pointer}.rail-button svg{width:21px;height:21px;fill:currentColor}.rail-button:hover,.rail-button.active{color:white;background:rgba(166,140,255,.16)}
    .main{min-width:0;padding:28px 38px 32px;overflow:hidden}.topbar{height:54px;display:flex;align-items:center;justify-content:space-between}.identity strong{font-size:19px}.status{display:flex;align-items:center;gap:12px}.search{width:260px;height:42px;border:1px solid rgba(255,255,255,.07);border-radius:14px;background:rgba(255,255,255,.055);display:flex;align-items:center;gap:10px;padding:0 14px;color:var(--muted)}.search input{width:100%;border:0;outline:0;background:none;color:white;font:inherit}.clock{font-size:14px;color:#cbd0dc}.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#ffc36a,#7c58d9)}
    .content{height:calc(100% - 54px);overflow-y:auto;padding:8px 6px 40px 0;scrollbar-width:none}.hero{position:relative;height:300px;border-radius:26px;overflow:hidden;margin:0 0 28px;background:#171a22}.hero-bg{position:absolute;inset:0;background-image:linear-gradient(90deg,rgba(7,8,12,.96) 0%,rgba(7,8,12,.74) 42%,rgba(7,8,12,.12) 100%),url('images.jpg');background-size:cover;background-position:center 28%}.hero-copy{position:absolute;z-index:2;left:42px;bottom:36px;width:58%}.hero h1{font-size:44px;line-height:1;margin:12px 0 8px}.hero p{max-width:520px;margin:0 0 20px;color:#bbc0cc}.actions{display:flex;gap:10px}.play{height:44px;border:0;border-radius:14px;padding:0 18px;font-weight:800;cursor:pointer;background:white;color:#11131a}
    .section{margin-top:4px}.section-head{display:flex;align-items:baseline;justify-content:space-between;margin:0 4px 12px}.section-head h2{font-size:20px;margin:0}.cards{display:grid;grid-template-columns:repeat(5,minmax(170px,1fr));gap:14px}.card{position:relative;height:176px;border-radius:18px;border:1px solid rgba(255,255,255,.06);overflow:hidden;background:var(--panel);cursor:pointer;transition:.18s ease}.card:hover{transform:scale(1.035);border-color:rgba(166,140,255,.48)}.movie-card .card-art{position:absolute;inset:0;background-image:linear-gradient(180deg,rgba(7,8,12,.05),rgba(7,8,12,.72)),url('images.jpg');background-size:cover;background-position:center}.card-meta{position:absolute;z-index:2;left:16px;right:16px;bottom:14px}.card-meta small{color:#bbc1cf}.card-meta strong{display:block;margin-top:4px;font-size:16px}
    .player{position:fixed;z-index:100;inset:0;display:none;background:#050609}.player.open{display:block}.player iframe{width:100%;height:100%;border:0}.player-close{position:absolute;z-index:101;top:18px;right:18px;width:44px;height:44px;border:1px solid rgba(255,255,255,.18);border-radius:50%;background:rgba(8,9,12,.82);color:white;font-size:22px;cursor:pointer}
    @media(max-width:1100px){.cards{grid-template-columns:repeat(4,minmax(150px,1fr))}.search{width:190px}}@media(max-width:760px){body{overflow:auto}.shell{grid-template-columns:66px 1fr}.rail{padding-inline:6px}.main{padding:18px}.hero{height:320px}.hero-copy{left:24px;width:75%}.hero h1{font-size:34px}.cards{grid-template-columns:repeat(2,minmax(130px,1fr))}.search{display:none}}
  </style>
</head>
<body>
  <div class="shell">
    <nav class="rail" aria-label="TV OS navigation"><div class="mark">M</div>
      <button class="rail-button active" aria-label="Home" title="Home"><svg viewBox="0 0 24 24"><path d="M12 3 2.5 11H5v9h5v-6h4v6h5v-9h2.5L12 3Z"/></svg></button>
      <button class="rail-button" aria-label="Movies" title="Movies"><svg viewBox="0 0 24 24"><path d="M3 5h18v14H3V5Zm2 2v3h3V7H5Zm5 0v3h4V7h-4Zm6 0v3h3V7h-3ZM5 12v5h3v-5H5Zm5 0v5h4v-5h-4Zm6 0v5h3v-5h-3Z"/></svg></button>
      <a class="rail-button" href="index.html" aria-label="Games" title="Games">✦</a>
    </nav>
    <main class="main">
      <header class="topbar"><div class="identity"><strong>themediawhoise</strong></div><div class="status"><label class="search" aria-label="Search"><span>⌕</span><input id="search" type="search" placeholder="Search"></label><time class="clock" id="clock">00:00</time><div class="avatar"></div></div></header>
      <div class="content">
        <section class="hero"><div class="hero-bg"></div><div class="hero-copy"><h1 id="hero-title">Iron Man</h1><p>Open the movie on this page using the Google Drive player.</p><div class="actions"><button class="play" data-drive="1etZlXVkk2dmSbB5m2J4EK80c7FggVF4V">▶&nbsp; Play</button></div></div></section>
        <section class="section"><div class="section-head"><h2>Movies</h2></div><div class="cards">
          <article class="card movie-card" tabindex="0" data-drive="1etZlXVkk2dmSbB5m2J4EK80c7FggVF4V"><div class="card-art"></div><div class="card-meta"><small>Movie</small><strong>Iron Man</strong></div></article>
        </div></section>
      </div>
    </main>
  </div>
  <div class="player" id="player" role="dialog" aria-modal="true" aria-label="Movie player"><button class="player-close" id="close-player" aria-label="Close player">×</button><iframe id="drive-frame" title="Iron Man" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen></iframe></div>
  <script>
    const clock=document.getElementById('clock');function updateClock(){clock.textContent=new Intl.DateTimeFormat([],{hour:'numeric',minute:'2-digit'}).format(new Date())}updateClock();setInterval(updateClock,30000);
    const player=document.getElementById('player'),frame=document.getElementById('drive-frame');function openDrive(id){frame.src='https://drive.google.com/file/d/'+id+'/preview';player.classList.add('open')}function closePlayer(){player.classList.remove('open');frame.src=''}
    document.querySelectorAll('[data-drive]').forEach(card=>{card.addEventListener('click',()=>openDrive(card.dataset.drive));card.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' ')openDrive(card.dataset.drive)})});document.getElementById('close-player').addEventListener('click',closePlayer);document.addEventListener('keydown',event=>{if(event.key==='Escape')closePlayer()});
    document.getElementById('search').addEventListener('input',event=>{const q=event.target.value.toLowerCase();document.querySelectorAll('.card').forEach(card=>card.style.display=card.textContent.toLowerCase().includes(q)?'block':'none')});
  </script>
</body>
</html>
