<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b18">
  <title>Game | thegameswhoise</title>
  <link rel="icon" type="image/png" href="logo.png">
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#080b18;font-family:system-ui,sans-serif}.game-frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#080b18}.home{position:fixed;z-index:5;top:14px;left:14px;width:42px;height:42px;display:grid;place-items:center;border-radius:10px;background:rgba(8,11,24,.72);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(8px);transition:transform .2s,background .2s}.home:hover{transform:scale(1.06);background:rgba(8,11,24,.92)}.home img{display:block;width:27px;height:27px;object-fit:contain}.watermark{position:fixed;z-index:5;left:12px;bottom:10px;color:#fff;font-size:11px;opacity:.22;pointer-events:none;letter-spacing:.04em;text-shadow:0 1px 3px #000}
  </style>
</head>
<body>
  <iframe class="game-frame" id="game" title="Game" allow="fullscreen; autoplay; gamepad; microphone; clipboard-read; clipboard-write" allowfullscreen></iframe>
  <a class="home" href="index.html" aria-label="Home"><img src="logo.png" alt=""></a>
  <div class="watermark">thegameswhoise</div>
  <script>
    const sources={"1v1":"1v1.html","minecraft":"Minceraft%20fixed.html"};
    const selected=new URLSearchParams(location.search).get('game');
    const source=sources[selected];
    if(source){document.getElementById('game').src=source;}else{document.body.innerHTML='<p style="color:white;font:16px system-ui;padding:24px">Game not found. <a style="color:#c3b4ff" href="index.html">Return home</a></p>';}
  </script>
</body>
</html>
