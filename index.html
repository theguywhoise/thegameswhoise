<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b18">
  <meta name="description" content="thegameswhoise">
  <title>thegameswhoise</title>
  <link rel="icon" type="image/png" href="logo.png">
  <style>
    :root{color-scheme:dark;--bg:#080b18;--panel:#101529;--line:rgba(174,184,255,.12);--text:#f4f4ff;--muted:#989db8;--purple:#a98bff}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 12% 9%,rgba(108,70,207,.23),transparent 35%),radial-gradient(ellipse at 88% 16%,rgba(59,95,180,.12),transparent 30%),var(--bg);color:var(--text);font-family:Inter,"Segoe UI",system-ui,sans-serif}.wrap{width:min(1180px,calc(100% - 44px));margin:auto}header{height:78px;border-bottom:1px solid rgba(255,255,255,.07);display:flex;align-items:center;background:rgba(8,11,24,.55);backdrop-filter:blur(16px)}header .wrap{display:flex;align-items:center;justify-content:space-between}.brand{color:white;text-decoration:none;font-weight:800}.nav-links{display:flex;gap:10px;align-items:center}.nav-link{color:#cbd0e8;text-decoration:none;border:1px solid var(--line);padding:10px 14px;border-radius:12px;font-size:14px}.nav-link:hover{background:rgba(169,139,255,.12)}.banner{width:100%;display:flex;align-items:center;justify-content:center;gap:16px;padding:13px 20px;text-decoration:none;color:white;background:linear-gradient(100deg,#6255ca,#9a77dc 52%,#557bd1);border-bottom:1px solid rgba(255,255,255,.16);box-shadow:0 10px 30px rgba(38,34,92,.22)}.banner-mark{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22);font-size:19px}.banner-copy{display:flex;flex-direction:column}.banner-copy strong{font-size:15px}.banner-copy span{font-size:12px;color:rgba(255,255,255,.72)}.banner-arrow{margin-left:8px;font-size:20px}.hero{text-align:center;padding:70px 20px 48px}.hero img{width:92px;height:92px;border-radius:24px}.hero h1{font-size:52px;margin:20px 0 8px}.hero p{color:var(--muted)}.section-head{display:flex;justify-content:space-between;align-items:end}.games-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin:20px 0 60px}.game{position:relative;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line);background:var(--panel);border-radius:16px;min-height:210px;text-decoration:none;color:white;transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}.game:hover{transform:translateY(-4px);border-color:rgba(169,139,255,.48);box-shadow:0 16px 34px rgba(0,0,0,.28)}.game-art{height:128px;position:relative;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 78% 20%,rgba(255,255,255,.28),transparent 20%),linear-gradient(135deg,hsl(var(--hue) 72% 34%),hsl(calc(var(--hue) + 48) 68% 18%))}.game-art:before{content:"";position:absolute;width:150px;height:150px;border:1px solid rgba(255,255,255,.16);border-radius:36px;right:-42px;top:-78px;transform:rotate(-24deg);background:rgba(255,255,255,.06)}.game-art:after{content:"";position:absolute;width:88px;height:88px;border:1px solid rgba(255,255,255,.13);border-radius:50%;left:-34px;bottom:-48px;background:rgba(255,255,255,.07)}.game-icon{position:relative;z-index:2;width:62px;height:62px;border-radius:18px;display:grid;place-items:center;background:rgba(6,8,18,.34);border:1px solid rgba(255,255,255,.34);box-shadow:0 10px 28px rgba(0,0,0,.28);font-size:27px;font-weight:900;text-shadow:0 2px 8px rgba(0,0,0,.45);backdrop-filter:blur(6px)}.game.special-one .game-art{background:radial-gradient(circle at 74% 24%,rgba(255,255,255,.3),transparent 16%),linear-gradient(135deg,#aa67df,#4d42a8 72%,#252c67)}.game.special-two .game-art{background:radial-gradient(circle at 72% 24%,rgba(255,255,255,.22),transparent 15%),linear-gradient(135deg,#69ae63,#356b47 58%,#183a2e)}.game-copy{padding:14px 16px}.game h3{margin:0 0 7px;font-size:15px}.game p{color:var(--muted);font-size:13px;margin:0 0 10px}.game small{color:#777f9e}.toolbar{display:flex;gap:10px;margin-top:18px}.toolbar input,.toolbar select{border:1px solid var(--line);background:#101529;color:white;border-radius:10px;padding:11px}.toolbar input{flex:1}.footer{border-top:1px solid rgba(255,255,255,.07);padding:24px 0;color:var(--muted)}.footer-inner{display:flex;justify-content:space-between}@media(max-width:900px){.games-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:650px){.wrap{width:min(100% - 30px,520px)}.games-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero h1{font-size:38px}.footer-inner{gap:20px}.banner{justify-content:flex-start;padding-inline:18px}}
  </style>
</head>
<body>
  <header><div class="wrap"><a class="brand" href="#home">✦ thegameswhoise</a><nav class="nav-links" aria-label="Site navigation"><a class="nav-link" href="account.html">Account</a></nav></div></header>
  <a class="banner" href="themediawhoise.html" aria-label="Open themediawhoise"><span class="banner-mark">▶</span><span class="banner-copy"><strong>themediawhoise</strong><span>Open the TV experience</span></span><span class="banner-arrow">→</span></a>
  <main class="wrap" id="home"><section class="hero"><img src="logo.png" alt="thegameswhoise logo"><h1>Thegameswhoise</h1><p>the self proclaimed best games site AND DONT YOU FORGET IT</p></section>
    <section id="library"><div class="section-head"><div><h2>Games</h2><p>40 games.</p></div></div><div class="toolbar"><input id="game-search" type="search" placeholder="Search the galaxy..." aria-label="Search games"><select id="sort-games" aria-label="Sort games"><option value="asc">A–Z</option><option value="desc">Z–A</option></select></div><div class="games-grid" id="games-grid"></div></section>
  </main>
  <footer class="footer"><div class="wrap footer-inner"><span>thegameswhoise</span><span>it says gullible on the ceiling ✦</span></div></footer>
  <script src="account.js"></script>
  <script>
    const games=Array.from({length:40},(_,index)=>({slot:index+1,id:index===0?'1v1':index===1?'minecraft':`slot-${index+1}`,title:index===0?'1v1.LOL':index===1?'Minceraft fixed':`Open slot ${String(index+1).padStart(2,'0')}`,description:index===0?'Battle game':index===1?'Minecraft adventure':'Waiting for a hero.',url:index===0?'1v1.html':index===1?'Minceraft fixed.html':'#'}));
    const grid=document.getElementById('games-grid'),search=document.getElementById('game-search'),sort=document.getElementById('sort-games');
    function renderGames(){const query=search.value.trim().toLowerCase(),direction=sort.value==='asc'?1:-1;const visible=games.filter(game=>`${game.title} ${game.description} ${game.slot}`.toLowerCase().includes(query)).sort((a,b)=>direction*a.title.localeCompare(b.title));grid.innerHTML=visible.map(game=>{const hue=(game.slot*47+205)%360,icon=game.slot===1?'⚔':game.slot===2?'▦':String(game.slot).padStart(2,'0'),special=game.slot===1?'special-one':game.slot===2?'special-two':'';return `<a class="game ${special}" href="${game.url}" data-game-id="${game.id}" data-game-title="${game.title}" style="--hue:${hue}"><div class="game-art"><span class="game-icon" aria-hidden="true">${icon}</span></div><div class="game-copy"><h3>${game.title}</h3><p>${game.description}</p><small>#${String(game.slot).padStart(2,'0')}</small></div></a>`}).join('')}
    grid.addEventListener('click',event=>{const link=event.target.closest('a[data-game-id]');if(!link||link.getAttribute('href')==='#')return;try{window.TheGamesWhoiseAccount?.recordGame(link.dataset.gameId,link.dataset.gameTitle,link.getAttribute('href'))}catch(error){console.warn('Could not save local game activity',error)}});
    search.addEventListener('input',renderGames);sort.addEventListener('change',renderGames);renderGames();
  </script>
</body>
</html>
