<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b18">
  <meta name="description" content="thegameswhoise">
  <title>thegameswhoise</title>
  <link rel="icon" type="image/png" href="logo.png">
  <style>
    :root{color-scheme:dark;--bg:#080b18;--panel:#101529;--line:rgba(174,184,255,.12);--text:#f4f4ff;--muted:#989db8;--purple:#a98bff}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 12% 9%,rgba(108,70,207,.23),transparent 35%),radial-gradient(ellipse at 88% 16%,rgba(59,95,180,.12),transparent 30%),var(--bg);color:var(--text);font-family:Inter,"Segoe UI",system-ui,sans-serif}.wrap{width:min(1180px,calc(100% - 44px));margin:auto}header{height:78px;border-bottom:1px solid rgba(255,255,255,.07);display:flex;align-items:center;background:rgba(8,11,24,.55);backdrop-filter:blur(16px)}header .wrap{display:flex;align-items:center;justify-content:space-between}.brand{color:white;text-decoration:none;font-weight:800}.nav-link{color:#cbd0e8;text-decoration:none;border:1px solid var(--line);padding:10px 14px;border-radius:12px;font-size:14px}.nav-link:hover{background:rgba(169,139,255,.12)}.hero{text-align:center;padding:70px 20px 48px}.hero img{width:92px;height:92px;border-radius:24px}.hero h1{font-size:52px;margin:20px 0 8px}.hero p{color:var(--muted)}.section-head{display:flex;justify-content:space-between;align-items:end}.games-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin:20px 0 60px}.game{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:18px;min-height:150px;text-decoration:none;color:white}.game h3{margin:0 0 8px}.game p{color:var(--muted);font-size:13px}.toolbar{display:flex;gap:10px;margin-top:18px}.toolbar input,.toolbar select{border:1px solid var(--line);background:#101529;color:white;border-radius:10px;padding:11px}.toolbar input{flex:1}.footer{border-top:1px solid rgba(255,255,255,.07);padding:24px 0;color:var(--muted)}.footer-inner{display:flex;justify-content:space-between}@media(max-width:900px){.games-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:650px){.wrap{width:min(100% - 30px,520px)}.games-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero h1{font-size:38px}.footer-inner{gap:20px}}
  </style>
</head>
<body>
  <header><div class="wrap"><a class="brand" href="#home">✦ thegameswhoise</a><a class="nav-link" href="themediawhoise.html">themediawhoise →</a></div></header>
  <main class="wrap" id="home">
    <section class="hero"><img src="logo.png" alt="thegameswhoise logo"><h1>Thegameswhoise</h1><p>the self proclaimed best games site AND DONT YOU FORGET IT</p></section>
    <section id="library"><div class="section-head"><div><h2>Games</h2><p>40 games.</p></div></div>
      <div class="toolbar"><input id="game-search" type="search" placeholder="Search the galaxy..." aria-label="Search games"><select id="sort-games" aria-label="Sort games"><option value="asc">A–Z</option><option value="desc">Z–A</option></select></div>
      <div class="games-grid" id="games-grid"></div>
    </section>
  </main>
  <footer class="footer"><div class="wrap footer-inner"><span>thegameswhoise</span><span>it says gullible on the ceiling ✦</span></div></footer>
  <script>
    const games=Array.from({length:40},(_,index)=>({slot:index+1,title:index===0?'1v1.LOL':index===1?'Minecraft':`Open slot ${String(index+1).padStart(2,'0')}`,description:index===0?'Battle game':index===1?'Minecraft adventure':'Waiting for a hero.',url:index===0?'1v1.html':index===1?'Minceraft fixed.html':'#'}));
    const grid=document.getElementById('games-grid'),search=document.getElementById('game-search'),sort=document.getElementById('sort-games');
    function renderGames(){const query=search.value.trim().toLowerCase(),direction=sort.value==='asc'?1:-1;const visible=games.filter(game=>`${game.title} ${game.description} ${game.slot}`.toLowerCase().includes(query)).sort((a,b)=>direction*a.title.localeCompare(b.title));grid.innerHTML=visible.map(game=>`<a class="game" href="${game.url}"><h3>${game.title}</h3><p>${game.description}</p><small>#${String(game.slot).padStart(2,'0')}</small></a>`).join('')}
    search.addEventListener('input',renderGames);sort.addEventListener('change',renderGames);renderGames();
  </script>
</body>
</html>
