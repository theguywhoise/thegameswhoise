<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b18">
  <meta name="description" content="A password-protected vault">
  <title>The Vault | thegameswhoise</title>
  <link rel="icon" type="image/png" href="logo.png">
  <style>
    :root{color-scheme:dark;--bg:#080b18;--panel:#101529;--line:rgba(174,184,255,.16);--text:#f4f4ff;--muted:#989db8;--purple:#a98bff}
    *{box-sizing:border-box}
    html,body{min-height:100%;margin:0}
    body{min-height:100vh;padding:28px 20px 104px;background:radial-gradient(ellipse at 50% 0,rgba(108,70,207,.24),transparent 44%),var(--bg);color:var(--text);font:16px/1.5 system-ui,sans-serif}
    .topbar{max-width:760px;margin:0 auto}
    .topbar a{color:var(--muted);text-decoration:none}
    .topbar a:hover{color:var(--text)}
    main{width:min(100%,440px);margin:clamp(72px,16vh,150px) auto 0;padding:32px;border:1px solid var(--line);border-radius:20px;background:rgba(16,21,41,.88);box-shadow:0 24px 80px #0005;text-align:center}
    .mark{display:grid;place-items:center;width:54px;height:54px;margin:0 auto 18px;border:1px solid var(--line);border-radius:16px;background:#a98bff18;color:var(--purple);font-size:25px}
    h1{margin:0;font-size:clamp(30px,8vw,40px);letter-spacing:-.04em}
    .intro{margin:10px 0 24px;color:var(--muted)}
    label{display:block;margin-bottom:8px;text-align:left;font-size:14px;font-weight:650}
    input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:11px;outline:none;background:#080b18;color:var(--text);font:inherit}
    input:focus{border-color:var(--purple);box-shadow:0 0 0 3px #a98bff24}
    .status{min-height:24px;margin:12px 0 0;color:#ff9eae;font-size:14px}
    #vault-content{margin-top:22px;padding:16px;border:1px solid var(--line);border-radius:12px;background:#080b18;text-align:left}
    #vault-content[hidden]{display:none}
    .bottom-action{position:fixed;right:0;bottom:0;left:0;padding:16px 20px max(16px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:rgba(8,11,24,.92);backdrop-filter:blur(12px)}
    .bottom-action button{display:block;width:min(100%,440px);margin:0 auto;padding:14px 18px;border:0;border-radius:12px;background:linear-gradient(135deg,#a98bff,#8264ed);color:#100c20;font:700 16px system-ui,sans-serif;cursor:pointer}
    .bottom-action button:hover{filter:brightness(1.08)}
    .bottom-action button:focus-visible{outline:3px solid white;outline-offset:3px}
    @media(max-width:480px){main{padding:26px 20px}}
  </style>
</head>
<body>
  <div class="topbar"><a href="index.html">← Back to thegameswhoise</a></div>
  <main>
    <div class="mark" aria-hidden="true">✦</div>
    <h1>The Vault</h1>
    <p class="intro">Enter the password to unlock the vault.</p>
    <form id="vault-form">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required aria-describedby="status">
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </form>
    <section id="vault-content" hidden tabindex="-1">
      <strong>Vault unlocked ✨</strong>
      <p>You’re in. Add your private vault content here.</p>
    </section>
  </main>
  <div class="bottom-action"><button type="submit" form="vault-form">Unlock the vault</button></div>
  <script>
    // This is a simple client-side gate, not secure storage. Do not put sensitive data here.
    const VAULT_PASSWORD = 'asd785f823hgg5h5g3hfhu*nsad***';
    const form = document.getElementById('vault-form');
    const input = document.getElementById('password');
    const status = document.getElementById('status');
    const content = document.getElementById('vault-content');

    form.addEventListener('submit', event => {
      event.preventDefault();
      if (input.value === VAULT_PASSWORD) {
        status.textContent = '';
        content.hidden = false;
        content.focus();
      } else {
        content.hidden = true;
        status.textContent = 'That password didn’t work. Try again.';
        input.select();
      }
    });
  </script>
</body>
</html>
