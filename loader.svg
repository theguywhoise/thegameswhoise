<svg xmlns="http://www.w3.org/2000/svg" xmlns:xhtml="http://www.w3.org/1999/xhtml" width="100%" height="100%" viewBox="0 0 100 100">
  <foreignObject width="100%" height="100%" requiredExtensions="http://www.w3.org/1999/xhtml">
    <xhtml:html xmlns="http://www.w3.org/1999/xhtml" lang="en">
      <xhtml:head>
        <xhtml:meta charset="utf-8"/>
        <xhtml:meta name="viewport" content="width=device-width, initial-scale=1"/>
        <xhtml:meta http-equiv="refresh" content="0; url=index.html"/>
        <xhtml:title>Thegameswhoise</xhtml:title>
        <xhtml:style>
          html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #080b18; }
          body { display: grid; place-items: center; }
          .loader { width: 64px; height: 64px; border: 6px solid #e5e7eb; border-top-color: #3b82f6; border-radius: 50%; animation: spin 0.8s linear infinite; }
          @keyframes spin { to { transform: rotate(360deg); } }
        </xhtml:style>
        <xhtml:script>
          window.location.replace("index.html");
        </xhtml:script>
      </xhtml:head>
      <xhtml:body>
        <xhtml:div class="loader" aria-label="Loading" role="img"></xhtml:div>
      </xhtml:body>
    </xhtml:html>
  </foreignObject>
</svg>
