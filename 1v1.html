<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>1v1.LOL</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/n-101-1/1@main/style.css">
  <style>
    html, body { width:100%; height:100%; margin:0; padding:0; overflow:hidden; background:#080b18; }
    .webgl-content, #gameContainer { position:fixed; inset:0; width:100vw; height:100vh; overflow:hidden; }
    #gameContainer canvas { max-width:100vw !important; max-height:100vh !important; }
    #game-brand { position:fixed; z-index:10; inset:0; display:grid; place-items:center; background:#080b18; pointer-events:none; transition:opacity .35s ease; }
    #game-brand img { width:min(42vw, 240px); max-height:70vh; object-fit:contain; border-radius:14px; }
    #game-brand.is-hidden { opacity:0; }
  </style>
  <script src="https://cdn.jsdelivr.net/gh/n-101-1/1@main/UnityProgress.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/n-101-1/1@main/2.7.js"></script>
</head>
<body>
  <div class="webgl-content"><div id="gameContainer"></div></div>
  <div id="game-brand" aria-label="Loading 1v1.LOL"><img src="1v1-logo.svg" alt="1v1.LOL"></div>
  <script>
    let gameInstance;
    const loginQueue = [];
    let firebaseReady = false;
    let firebaseFailed = false;

    // Unity can request sign-in before optional Firebase scripts finish loading.
    // Keep the expected global available and replay requests once the SDK is ready.
    function firebaseLoginProxy() {
      const args = Array.from(arguments);
      if (firebaseReady && typeof window._firebaseLoginImpl === 'function') {
        return window._firebaseLoginImpl.apply(window, args);
      }
      if (firebaseFailed) {
        if (typeof args[2] === 'function') args[2]('Firebase login could not be loaded.');
        return;
      }
      loginQueue.push(args);
    }
    window.firebaseLogin = firebaseLoginProxy;

    function loadScript(src) {
      return new Promise(function (resolve, reject) {
        const script = document.createElement('script');
        script.src = src;
        script.onload = resolve;
        script.onerror = function () { reject(new Error('Failed to load ' + src)); };
        document.head.appendChild(script);
      });
    }

    // Load Firebase in dependency order without holding up Unity's game download.
    (async function loadFirebaseIntegration() {
      const cdn = 'https://cdn.jsdelivr.net/gh/n-101-1/1@main/';
      try {
        await loadScript(cdn + '1firebase-app.js');
        await loadScript(cdn + '1firebase-auth.js');
        await loadScript(cdn + '1firebase-firestore.js');
        await loadScript(cdn + '1firebase.js');
        if (typeof window.initializeFireBase === 'function') window.initializeFireBase();
        await loadScript(cdn + '1login.js?v=2');
        await loadScript(cdn + '1firestore.js');
        window._firebaseLoginImpl = window.firebaseLogin;
        window.firebaseLogin = firebaseLoginProxy;
        firebaseReady = typeof window._firebaseLoginImpl === 'function';
        while (firebaseReady && loginQueue.length) {
          window._firebaseLoginImpl.apply(window, loginQueue.shift());
        }
      } catch (error) {
        firebaseFailed = true;
        console.error('Firebase integration failed to load:', error);
        while (loginQueue.length) {
          const args = loginQueue.shift();
          if (typeof args[2] === 'function') args[2]('Firebase login could not be loaded.');
        }
      }
    })();

    document.addEventListener('DOMContentLoaded', function () {
      gameInstance = UnityLoader.instantiate(
        'gameContainer',
        'https://cdn.jsdelivr.net/gh/n-101-1/1@main/2.7.json',
        {
          onProgress: UnityProgress,
          Module: {
            onRuntimeInitialized: function () {
              UnityProgress(gameInstance, 'complete');
              document.getElementById('game-brand').classList.add('is-hidden');
            }
          }
        }
      );
    });

    function showAds() { console.log('show ads'); }
    function requestNewAd() { unityAdFinishedCallback(); }
    function unityAdFinishedCallback() {
      try {
        if (gameInstance) gameInstance.SendMessage('AdsManager', 'OnWebCallback');
      } catch (error) {
        console.log(error);
      }
    }
  </script>
</body>
</html>
